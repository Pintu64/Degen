services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U scanner"], interval: 5s, timeout: 5s, retries: 10}
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
  bot:
    build: .
    env_file: .env
    environment: {SERVICE_ROLE: bot}
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  scanner:
    build: .
    env_file: .env
    environment: {SERVICE_ROLE: scanner}
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  tracker:
    build: .
    env_file: .env
    environment: {SERVICE_ROLE: tracker}
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  telegram:
    build: .
    env_file: .env
    environment: {SERVICE_ROLE: telegram}
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
volumes: {postgres_data: {}}
